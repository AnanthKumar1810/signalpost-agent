name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-install-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Compile all Python modules
        run: python -m py_compile signalpost_agent.py nav_jobs.py public_ats.py wikidata_websites.py brave_websites.py llm_summary.py claim_judge.py
