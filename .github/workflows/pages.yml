name: Publish sample dashboard

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    outputs:
      enabled: ${{ steps.pages-check.outputs.enabled }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check GitHub Pages configuration
        id: pages-check
        shell: bash
        run: |
          status=$(curl -sS -o "$RUNNER_TEMP/pages.json" -w '%{http_code}' "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [[ "$status" == "200" ]] && [[ "$(jq -r '.build_type // empty' "$RUNNER_TEMP/pages.json")" == "workflow" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled with the GitHub Actions source. Enable it in repository Settings > Pages to publish this dashboard."
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages-check.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages-check.outputs.enabled == 'true'
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: steps.pages-check.outputs.enabled == 'true'
